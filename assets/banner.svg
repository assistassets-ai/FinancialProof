<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%">
  <!-- Definitions of gradients, filters, etc. -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c15" />
      <stop offset="60%" stop-color="#042f24" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Radial Highlight behind the icon -->
    <radialGradient id="radialHighlight" cx="20%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Receipt Paper Gradient -->
    <linearGradient id="receiptGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>

    <!-- Badge Gradient (Verified Checkmark) -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Trend Line Gradient -->
    <linearGradient id="trendLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Text Gradient for Wordmark -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Drop Shadow Filter for Receipt -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#010b08" flood-opacity="0.5" />
    </filter>

    <!-- Soft Glow Filter for Trend Line and Checkmark -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" />

  <!-- Radial Glow behind the Receipt and Chart -->
  <rect width="1200" height="340" fill="url(#radialHighlight)" />

  <!-- Background Candlestick Chart (Inside Safe Zone: x:80..1120 y:60..300) -->
  <g opacity="0.22">
    <!-- Grid lines -->
    <line x1="80" y1="100" x2="450" y2="100" stroke="#0f766e" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <line x1="80" y1="160" x2="450" y2="160" stroke="#0f766e" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <line x1="80" y1="220" x2="450" y2="220" stroke="#0f766e" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <line x1="80" y1="280" x2="450" y2="280" stroke="#0f766e" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />

    <!-- Candle 1 (Bearish) -->
    <line x1="100" y1="175" x2="100" y2="240" stroke="#065f46" stroke-width="2" />
    <rect x="92" y="185" width="16" height="40" rx="2" fill="#065f46" />

    <!-- Candle 2 (Bullish) -->
    <line x1="150" y1="140" x2="150" y2="210" stroke="#34d399" stroke-width="2" />
    <rect x="142" y="150" width="16" height="45" rx="2" fill="#34d399" />

    <!-- Candle 3 (Bullish) -->
    <line x1="200" y1="110" x2="200" y2="180" stroke="#34d399" stroke-width="2" />
    <rect x="192" y="120" width="16" height="45" rx="2" fill="#34d399" opacity="0.5" /> <!-- Behind the receipt -->

    <!-- Candle 4 (Bullish) -->
    <line x1="250" y1="90" x2="250" y2="160" stroke="#34d399" stroke-width="2" />
    <rect x="242" y="100" width="16" height="45" rx="2" fill="#34d399" opacity="0.5" /> <!-- Behind the receipt -->

    <!-- Candle 5 (Bearish) -->
    <line x1="300" y1="115" x2="300" y2="175" stroke="#065f46" stroke-width="2" />
    <rect x="292" y="125" width="16" height="35" rx="2" fill="#065f46" />

    <!-- Candle 6 (Bullish) -->
    <line x1="350" y1="75" x2="350" y2="145" stroke="#34d399" stroke-width="2" />
    <rect x="342" y="85" width="16" height="45" rx="2" fill="#34d399" />

    <!-- Candle 7 (Bullish) -->
    <line x1="400" y1="65" x2="400" y2="120" stroke="#10b981" stroke-width="2" />
    <rect x="392" y="70" width="16" height="35" rx="2" fill="#10b981" />

    <!-- Trend line in background -->
    <path d="M 100,205 Q 150,172.5 200,142.5 T 300,142.5 T 400,87.5" fill="none" stroke="url(#trendLineGrad)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Foreground Elements (Strictly inside x:80..1120 y:60..300) -->
  <g transform="translate(10, 0)">
    <!-- Dynamic Receipt Icon (Grouped to apply Rotation transform) -->
    <!-- Center of rotation is roughly x=200, y=170 -->
    <g transform="rotate(-4, 200, 170)" filter="url(#dropShadow)">
      <!-- Receipt Page -->
      <path d="M 130,75 
               L 270,75 
               L 270,255 
               L 260,265 L 250,255 L 240,265 L 230,255 L 220,265 L 210,255 L 200,265 L 190,255 L 180,265 L 170,255 L 160,265 L 150,255 L 140,265 L 130,255 
               Z" 
            fill="url(#receiptGrad)" />

      <!-- Barcode at the top of receipt -->
      <g opacity="0.7">
        <rect x="150" y="90" width="3" height="10" fill="#064e3b" />
        <rect x="156" y="90" width="6" height="10" fill="#064e3b" />
        <rect x="165" y="90" width="2" height="10" fill="#064e3b" />
        <rect x="170" y="90" width="4" height="10" fill="#064e3b" />
        <rect x="177" y="90" width="8" height="10" fill="#064e3b" />
        <rect x="188" y="90" width="2" height="10" fill="#064e3b" />
        <rect x="193" y="90" width="5" height="10" fill="#064e3b" />
        <rect x="201" y="90" width="3" height="10" fill="#064e3b" />
        <rect x="207" y="90" width="7" height="10" fill="#064e3b" />
        <rect x="217" y="90" width="2" height="10" fill="#064e3b" />
        <rect x="222" y="90" width="4" height="10" fill="#064e3b" />
        <rect x="229" y="90" width="6" height="10" fill="#064e3b" />
        <rect x="238" y="90" width="2" height="10" fill="#064e3b" />
        <rect x="243" y="90" width="5" height="10" fill="#064e3b" />
        <rect x="250" y="90" width="2" height="10" fill="#064e3b" />
      </g>

      <!-- Watermark Euro symbol on receipt -->
      <text x="200" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#10b981" fill-opacity="0.12" text-anchor="middle">€</text>

      <!-- Stylized item lines on receipt -->
      <rect x="150" y="115" width="100" height="4" rx="2" fill="#0f766e" opacity="0.3" />
      <rect x="150" y="130" width="80" height="4" rx="2" fill="#0f766e" opacity="0.2" />
      
      <!-- List of values -->
      <rect x="150" y="152" width="50" height="4" rx="2" fill="#0f766e" opacity="0.2" />
      <rect x="230" y="152" width="20" height="4" rx="2" fill="#0f766e" opacity="0.2" />
      
      <rect x="150" y="167" width="65" height="4" rx="2" fill="#0f766e" opacity="0.2" />
      <rect x="230" y="167" width="20" height="4" rx="2" fill="#0f766e" opacity="0.2" />
      
      <rect x="150" y="182" width="45" height="4" rx="2" fill="#0f766e" opacity="0.2" />
      <rect x="230" y="182" width="20" height="4" rx="2" fill="#0f766e" opacity="0.2" />
      
      <!-- Divider -->
      <line x1="150" y1="202" x2="250" y2="202" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3" />

      <!-- Total -->
      <rect x="150" y="215" width="55" height="6" rx="3" fill="#064e3b" opacity="0.7" />
      <text x="250" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#064e3b" text-anchor="end">€ 2,409.81</text>
    </g>

    <!-- Verified Badge (Overlaying Bottom Right of Receipt) -->
    <!-- Positioned relative to receipt. Center is x=265, y=235 -->
    <g transform="translate(265, 235)" filter="url(#glow)">
      <!-- Outer badge glow/ring -->
      <circle cx="0" cy="0" r="26" fill="#021c15" opacity="0.4" />
      <!-- Badge background -->
      <circle cx="0" cy="0" r="22" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="2.5" />
      <!-- Checkmark -->
      <path d="M -10,-1 L -3,6 L 9,-6" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Right Side Text & Info -->
    <!-- Wordmark -->
    <text x="440" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5">
      Financial<tspan fill="#34d399">Proof</tspan>
    </text>

    <!-- Tagline -->
    <text x="442" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#a7f3d0" letter-spacing="0.2">
      Verify transaction integrity &amp; statistical pattern metrics
    </text>

    <!-- Badges -->
    <!-- Badge 1: Local-First -->
    <g transform="translate(442, 225)">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1.2" />
      <text x="52.5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Local-First</text>
    </g>
    
    <!-- Badge 2: Zero-Trust -->
    <g transform="translate(557, 225)">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1.2" />
      <text x="52.5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Zero-Trust</text>
    </g>

    <!-- Badge 3: Open-Source -->
    <g transform="translate(672, 225)">
      <rect x="0" y="0" width="115" height="28" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1.2" />
      <text x="57.5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Open-Source</text>
    </g>

    <!-- Badge 4: Python Stack -->
    <g transform="translate(797, 225)">
      <rect x="0" y="0" width="125" height="28" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1.2" />
      <text x="62.5" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Python &amp; Streamlit</text>
    </g>

    <!-- Tech Stack / Under-Tagline Subtext -->
    <text x="444" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b" letter-spacing="0.5">
      SQLITE DATABASE INTEGRATION • SECURE PATTERN SCANNING • NO FINANCIAL ADVICE
    </text>
  </g>
</svg>
