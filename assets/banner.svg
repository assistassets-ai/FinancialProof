<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="FinancialProof Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#052e16"/>
      <stop offset="100%" style="stop-color:#14532d"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="340" fill="url(#bg)"/>

  <!-- Chart area background -->
  <rect x="95" y="85" width="290" height="185" rx="6" fill="#071f10" opacity="0.7"/>

  <!-- Grid lines in chart -->
  <line x1="95" y1="120" x2="385" y2="120" stroke="#1a4a2a" stroke-width="1"/>
  <line x1="95" y1="155" x2="385" y2="155" stroke="#1a4a2a" stroke-width="1"/>
  <line x1="95" y1="190" x2="385" y2="190" stroke="#1a4a2a" stroke-width="1"/>
  <line x1="95" y1="225" x2="385" y2="225" stroke="#1a4a2a" stroke-width="1"/>
  <line x1="155" y1="85" x2="155" y2="270" stroke="#1a4a2a" stroke-width="1"/>
  <line x1="215" y1="85" x2="215" y2="270" stroke="#1a4a2a" stroke-width="1"/>
  <line x1="275" y1="85" x2="275" y2="270" stroke="#1a4a2a" stroke-width="1"/>
  <line x1="335" y1="85" x2="335" y2="270" stroke="#1a4a2a" stroke-width="1"/>

  <!-- Candlestick bars -->
  <!-- Candle 1 (green) -->
  <rect x="110" y="170" width="22" height="60" rx="2" fill="#16a34a"/>
  <line x1="121" y1="155" x2="121" y2="170" stroke="#16a34a" stroke-width="2"/>
  <line x1="121" y1="230" x2="121" y2="245" stroke="#16a34a" stroke-width="2"/>
  <!-- Candle 2 (red) -->
  <rect x="168" y="145" width="22" height="45" rx="2" fill="#dc2626"/>
  <line x1="179" y1="132" x2="179" y2="145" stroke="#dc2626" stroke-width="2"/>
  <line x1="179" y1="190" x2="179" y2="205" stroke="#dc2626" stroke-width="2"/>
  <!-- Candle 3 (green) -->
  <rect x="226" y="125" width="22" height="55" rx="2" fill="#16a34a"/>
  <line x1="237" y1="110" x2="237" y2="125" stroke="#16a34a" stroke-width="2"/>
  <line x1="237" y1="180" x2="237" y2="200" stroke="#16a34a" stroke-width="2"/>
  <!-- Candle 4 (green) -->
  <rect x="284" y="105" width="22" height="50" rx="2" fill="#16a34a"/>
  <line x1="295" y1="92" x2="295" y2="105" stroke="#16a34a" stroke-width="2"/>
  <line x1="295" y1="155" x2="295" y2="170" stroke="#16a34a" stroke-width="2"/>
  <!-- Candle 5 (green, taller) -->
  <rect x="342" y="88" width="22" height="48" rx="2" fill="#4ade80"/>
  <line x1="353" y1="78" x2="353" y2="88" stroke="#4ade80" stroke-width="2"/>
  <line x1="353" y1="136" x2="353" y2="148" stroke="#4ade80" stroke-width="2"/>

  <!-- Trend line -->
  <polyline points="110,200 168,172 226,152 284,130 385,95" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.7"/>

  <!-- Euro symbol -->
  <text x="108" y="280" font-family="serif" font-size="22" fill="#4ade80" opacity="0.7">€</text>

  <!-- Checkmark (verification/proof) -->
  <circle cx="370" cy="100" r="18" fill="#16a34a" opacity="0.9"/>
  <polyline points="360,100 367,108 382,90" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Divider -->
  <line x1="425" y1="80" x2="425" y2="265" stroke="#16a34a" stroke-width="1.5" opacity="0.4"/>

  <!-- Right: Wordmark + Tagline -->
  <text x="462" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="-1">FinancialProof</text>
  <text x="464" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#4ade80" letter-spacing="0.5">Statistical Pattern Analysis · Local-first</text>
  <text x="466" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#94a3b8">Python · Streamlit · SQLite · No Financial Advice</text>
</svg>
