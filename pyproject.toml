[project]
name = "financial-proof"
version = "1.0.0"
description = "Finanz-Analyse Web-App mit ML-gestützter Marktanalyse"
authors = [{ name = "Lukas Geiger", email = "lukasgeiger@googlemail.com" }]
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"

dependencies = [
    "streamlit>=1.57.0,<2.0.0",
    "yfinance>=1.4.0,<2.0.0",
    "pandas>=2.0.0,<4.0.0",
    "numpy>=1.24.0,<3.0.0",
    "plotly>=6.7.0,<7.0.0",
    "statsmodels>=0.14.6,<1.0.0",
    "scipy>=1.11.0,<2.0.0",
    "arch>=6.2.0,<9.0.0",
    "scikit-learn>=1.4.0,<1.8.0",
    "tensorflow>=2.21.0,<3.0.0",
    "transformers>=5.9.0,<6.0.0",
    "torch>=2.0.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "beautifulsoup4>=4.14.3,<5.0.0",
    "tweepy>=4.14.0,<5.0.0",
    "google-api-python-client>=2.100.0,<3.0.0",
    "cryptography>=48.0.0,<50.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
